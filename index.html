<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111b19">
<link rel="manifest" href="manifest.webmanifest">
<title>Fort Zancudo Online</title>

<style>
:root {
  font-family: system-ui, Arial, sans-serif;
  color: #e8f0e9;
  background: #0b1411;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  background: #16251f;
  border-bottom: 1px solid #34493b;
  padding: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
h1 { font-size: 20px; letter-spacing: 1px; margin: 0; }
h2 { font-size: 24px; }
h3 { margin: 0 0 12px; }
small, .muted { color: #abc0af; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
input, textarea, select {
  display: block;
  width: 100%;
  padding: 12px;
  background: #0c1913;
  color: #f3f8f3;
  border: 1px solid #506657;
  border-radius: 9px;
  margin: 6px 0 14px;
}
textarea { min-height: 85px; }
label { font-size: 14px; color: #bfd2c2; }
.btn {
  padding: 11px 15px;
  background: #b0d29f;
  color: #132018;
  border: 0;
  border-radius: 9px;
  font-weight: 700;
}
.secondary { background: #2c4436; color: #e9f5e9; }
.danger { background: #633532; color: white; }
.wrap { max-width: 1100px; margin: auto; padding: 18px; }
.panel {
  background: #16241d;
  border: 1px solid #365040;
  border-radius: 15px;
  padding: 17px;
  margin: 14px 0;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}
.metric { font-size: 34px; color: #b5d9a8; font-weight: 700; }
.nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px;
  background: #101e17;
}
.nav button {
  border: 0;
  border-radius: 9px;
  padding: 12px;
  background: transparent;
  color: #d4e7d9;
  white-space: nowrap;
}
.nav .active { background: #315440; }
.hidden { display: none !important; }
.error { color: #ffaaa4; }
.table { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 550px; }
td, th {
  text-align: left;
  padding: 10px;
  border-bottom: 1px solid #3c5142;
  font-size: 14px;
}
.badge {
  background: #304f3c;
  border-radius: 20px;
  padding: 7px 11px;
  font-size: 12px;
}
.note { font-size: 13px; color: #a8c2ae; }
#notice {
  position: fixed;
  bottom: 15px;
  left: 15px;
  right: 15px;
  max-width: 600px;
  margin: auto;
  background: #3b5c44;
  padding: 14px;
  border-radius: 9px;
  display: none;
  z-index: 100;
}
#login { max-width: 480px; margin: 35px auto; }
.person-card {
  background: #16241d;
  border: 1px solid #365040;
  border-radius: 14px;
  padding: 17px;
}
.person-card p { margin: 8px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
button:disabled { opacity: .5; }
</style>
</head>

<body>

<header>
  <div>
    <h1>▣ FORT ZANCUDO</h1>
    <small>COMMANDANT CONTROL SYSTEM · ONLINE</small>
  </div>
  <span id="identity" class="badge">Гость</span>
</header>

<section id="setup" class="wrap hidden">
  <div class="panel">
    <h2>Первичная настройка</h2>
    <p>Проверьте файл config.js и настройки Supabase.</p>
  </div>
</section>

<section id="login" class="wrap hidden">
  <div class="panel">
    <h2>Вход в систему</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required autocomplete="username">

      <label>Пароль</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button class="btn" type="submit">Войти</button>
      <button class="btn secondary" type="button" id="backGuest">
        Продолжить как гость
      </button>
    </form>
    <p id="loginError" class="error"></p>
  </div>
</section>

<section id="system" class="hidden">
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active">Обзор</button>
    <button data-page="checks">Проверки</button>
    <button data-page="history">История</button>
    <button data-page="personnel">Личный состав</button>
    <button data-page="reports">Discord</button>
    <button data-page="accounts">Доступы</button>
    <button data-page="login">Войти</button>
    <button data-page="logout">Выход</button>
  </nav>
  <main id="app" class="wrap"></main>
</section>

<div id="notice"></div>

<script src="config.js"></script>

<script>
"use strict";

const U = [
  "Delta Force",
  "Military Police",
  "Military Academy",
  "Sloppy Division"
];

const $ = s => document.querySelector(s);

const E = x => String(x ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const today = () => {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
};

const cfg = window.FZ_CONFIG || {};

let session = null;
let profile = null;
let page = "dashboard";
let checks = [];
let personnel = [];
let profiles = [];
let poll = null;

const guest = () => !session;
const admin = () => ["general", "commandant"].includes(profile?.role);
const can = u => admin() ||
  (profile?.role === "commander" && profile.unit === u);
const units = () => admin() ? U :
  profile?.role === "commander" && U.includes(profile.unit)
    ? [profile.unit] : [];

function notice(message) {
  const n = $("#notice");
  n.textContent = message;
  n.style.display = "block";
  clearTimeout(notice.timer);
  notice.timer = setTimeout(() => n.style.display = "none", 4000);
}

function show(name) {
  for (const k of ["setup", "login", "system"]) {
    $("#" + k).classList.toggle("hidden", k !== name);
  }
}

async function request(path, options = {}) {
  const method = options.method || "GET";
  const headers = {
    apikey: cfg.key,
    "Content-Type": "application/json",
    ...options.headers
  };

  if (session?.access_token && options.auth !== false) {
    headers.Authorization = "Bearer " + session.access_token;
  }

  const response = await fetch(cfg.url + path, {
    method,
    headers,
    body: options.body === undefined
      ? undefined : JSON.stringify(options.body)
  });

  const text = await response.text();
  let data = null;

  if (text) {
    try { data = JSON.parse(text); }
    catch { data = text; }
  }

  if (!response.ok) {
    throw new Error(
      data?.message || data?.error_description ||
      data?.error || "HTTP " + response.status
    );
  }
  return data;
}

const table = (name, query = "") =>
  request("/rest/v1/" + name + "?" + query);

async function refreshToken() {
  if (!session?.refresh_token) return false;
  try {
    const s = await request("/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      auth: false,
      body: { refresh_token: session.refresh_token }
    });
    session = s;
    localStorage.setItem("fz_session", JSON.stringify(s));
    return true;
  } catch {
    session = null;
    profile = null;
    localStorage.removeItem("fz_session");
    return false;
  }
}

function updateNav() {
  const nav = $("#nav");

  for (const [name, visible] of [
    ["checks", units().length > 0],
    ["reports", !guest()],
    ["accounts", admin()],
    ["login", guest()],
    ["logout", !guest()]
  ]) {
    nav.querySelector('[data-page="' + name + '"]')
      .classList.toggle("hidden", !visible);
  }

  if (
    (page === "checks" && !units().length) ||
    (page === "accounts" && !admin()) ||
    (page === "reports" && guest())
  ) {
    page = "dashboard";
  }

  nav.querySelectorAll("button").forEach(b =>
    b.classList.toggle("active", b.dataset.page === page)
  );
}

async function loadData(redraw = true) {
  try {
    if (guest()) {
      const [c, p] = await Promise.all([
        table("checks", "select=*&order=date.desc"),
        table("personnel", "select=*&order=name.asc")
      ]);
      checks = c || [];
      personnel = p || [];
      profile = null;
      profiles = [];
      $("#identity").textContent = "Гость · просмотр";
    } else {
      const [p, c, people] = await Promise.all([
        table("profiles",
          "select=*&id=eq." + encodeURIComponent(session.user.id)),
        table("checks", "select=*&order=date.desc"),
        table("personnel", "select=*&order=name.asc")
      ]);

      profile = p?.[0];

      if (!profile) {
        throw new Error("Профиль пользователя не найден");
      }

      checks = c || [];
      personnel = people || [];

      profiles = admin()
        ? await table("profiles", "select=*&order=display_name.asc")
        : [];

      $("#identity").textContent =
        profile.display_name + " · " + profile.role;
    }

    updateNav();
    if (redraw) render();
  } catch (err) {
    notice("Ошибка загрузки: " + err.message);
  }
}

async function start() {
  if (!cfg.url || !cfg.key) {
    show("setup");
    return;
  }

  try {
    session = JSON.parse(localStorage.getItem("fz_session"));
  } catch {
    session = null;
  }

  if (session) await refreshToken();

  show("system");
  await loadData();
  startPolling();
}

function startPolling() {
  clearInterval(poll);
  poll = setInterval(async () => {
    if (session &&
        Date.now() / 1000 > (session.expires_at || 0) - 90) {
      await refreshToken();
    }
    await loadData(!["checks", "personnel", "reports", "accounts"]
      .includes(page));
  }, 15000);
}

$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  $("#loginError").textContent = "";

  try {
    const s = await request("/auth/v1/token?grant_type=password", {
      method: "POST",
      auth: false,
      body: {
        email: $("#email").value.trim(),
        password: $("#password").value
      }
    });

    session = s;
    localStorage.setItem("fz_session", JSON.stringify(s));
    $("#password").value = "";
    page = "dashboard";
    show("system");
    await loadData();
    startPolling();
  } catch (err) {
    $("#loginError").textContent = "Ошибка входа: " + err.message;
  }
};

$("#backGuest").onclick = () => {
  show("system");
  render();
};

$("#nav").onclick = async e => {
  const b = e.target.closest("[data-page]");
  if (!b) return;

  const target = b.dataset.page;

  if (target === "login") {
    show("login");
    return;
  }

  if (target === "logout") {
    clearInterval(poll);
    session = null;
    profile = null;
    localStorage.removeItem("fz_session");
    page = "dashboard";
    show("system");
    await loadData();
    startPolling();
    return;
  }

  page = target;
  updateNav();
  render();
};

function render() {
  if (page === "dashboard") dashboard();
  if (page === "checks") checkForm();
  if (page === "history") history();
  if (page === "personnel") peoplePage();
  if (page === "reports") reports();
  if (page === "accounts") accounts();
}

function dashboard() {
  const c = checks.filter(x => x.date === today());
  const visibleUnits = guest() || admin() ? U : units();

  $("#app").innerHTML = `
    <h2>Панель управления</h2>
    <p class="muted">
      ${E(today())} · ${E(profile?.display_name || "Гость")}
      · синхронизация каждые 15 секунд
    </p>

    <div class="grid">
      <div class="panel">
        <div class="muted">Подразделения</div>
        <div class="metric">${visibleUnits.length}</div>
      </div>
      <div class="panel">
        <div class="muted">Проверено сегодня</div>
        <div class="metric">${c.length}</div>
      </div>
      <div class="panel">
        <div class="muted">В строю</div>
        <div class="metric">
          ${c.reduce((a, x) => a + Number(x.present || 0), 0)}
        </div>
      </div>
      <div class="panel">
        <div class="muted">Личный состав</div>
        <div class="metric">${personnel.length}</div>
      </div>
    </div>

    <h3>Подразделения</h3>
    <div class="grid">
      ${visibleUnits.map(u => {
        const x = c.find(v => v.unit === u);
        return `
          <div class="panel">
            <h3>${E(u)}</h3>
            <span class="badge">
              ${E(x?.status || "Не проверено")}
            </span>
            <p>${x
              ? `${x.present} / ${x.total} в строю`
              : "Нет доклада за сегодня"}</p>
          </div>`;
      }).join("")}
    </div>
  `;
}

async function upsert(name, obj, conflict) {
  return request("/rest/v1/" + name +
    "?on_conflict=" + conflict, {
    method: "POST",
    body: obj,
    headers: {
      Prefer: "resolution=merge-duplicates,return=representation"
    }
  });
}

function checkForm() {
  const available = units();

  if (!available.length) {
    $("#app").innerHTML =
      "<h2>Проверки</h2><p>Нет прав на редактирование.</p>";
    return;
  }

  $("#app").innerHTML = `
    <h2>Ежедневная проверка</h2>
    <div class="panel">
      <label>Дата</label>
      <input id="date" type="date" value="${today()}">

      <label>Подразделение</label>
      <select id="unit">
        ${available.map(u => `<option>${E(u)}</option>`).join("")}
      </select>

      <form id="checkForm">
        <div class="grid">
          <div>
            <label>Всего</label>
            <input name="total" type="number" min="0" required>
          </div>
          <div>
            <label>В строю</label>
            <input name="present" type="number" min="0" required>
          </div>
        </div>

        <label>Состояние</label>
        <select name="status">
          <option>Без замечаний</option>
          <option>Есть замечания</option>
          <option>Не готово</option>
        </select>

        <label>Проделанная работа</label>
        <textarea name="work"></textarea>

        <label>Замечания</label>
        <textarea name="issues"></textarea>

        <label>Задачи</label>
        <textarea name="tasks"></textarea>

        <button class="btn" type="submit">
          Сохранить в общей базе
        </button>
      </form>
    </div>
  `;

  const f = $("#checkForm");

  function fill() {
    const c = checks.find(x =>
      x.date === $("#date").value &&
      x.unit === $("#unit").value
    );

    for (const k of [
      "total", "present", "status", "work", "issues", "tasks"
    ]) {
      f.elements[k].value = c?.[k] ??
        (k === "status" ? "Без замечаний" : "");
    }
  }

  $("#date").onchange = fill;
  $("#unit").onchange = fill;
  fill();

  f.onsubmit = async e => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(f));

    if (+data.present > +data.total) {
      notice("Явка больше общей численности");
      return;
    }

    try {
      await upsert("checks", {
        date: $("#date").value,
        unit: $("#unit").value,
        total: +data.total,
        present: +data.present,
        status: data.status,
        work: data.work,
        issues: data.issues,
        tasks: data.tasks
      }, "date,unit");

      notice("Проверка сохранена");
      await loadData();
    } catch (err) {
      notice("Ошибка: " + err.message);
    }
  };
}

function history() {
  const rows = [...checks].sort((a, b) =>
    b.date.localeCompare(a.date)
  );

  $("#app").innerHTML = `
    <h2>История проверок</h2>
    <div class="panel table">
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Подразделение</th>
            <th>Явка</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(c => `
            <tr>
              <td>${E(c.date)}</td>
              <td>${E(c.unit)}</td>
              <td>${Number(c.present)}/${Number(c.total)}</td>
              <td>${E(c.status)}</td>
              <td>
                <button class="btn secondary" data-view="${E(c.id)}">
                  Открыть
                </button>
                ${can(c.unit) ? `
                  <button class="btn danger" data-delete="${E(c.id)}">
                    Удалить
                  </button>` : ""}
              </td>
            </tr>
          `).join("") ||
          '<tr><td colspan="5">Записей нет</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  $("#app tbody").onclick = async e => {
    const b = e.target.closest("button");
    if (!b) return;

    const c = checks.find(x =>
      String(x.id) === (b.dataset.view || b.dataset.delete)
    );
    if (!c) return;

    if (b.dataset.view) {
      alert(
        `${c.date} — ${c.unit}\n` +
        `Явка: ${c.present}/${c.total}\n` +
        `Состояние: ${c.status}\n` +
        `Работа: ${c.work || "—"}\n` +
        `Замечания: ${c.issues || "—"}\n` +
        `Задачи: ${c.tasks || "—"}`
      );
      return;
    }

    if (!can(c.unit)) return;

    if (confirm("Удалить проверку?")) {
      try {
        await request("/rest/v1/checks?id=eq." +
          encodeURIComponent(c.id), { method: "DELETE" });
        await loadData();
      } catch (err) {
        notice(err.message);
      }
    }
  };
}

function peoplePage() {
  const available = units();
  const canEdit = available.length > 0;

  $("#app").innerHTML = `
    <h2>Личный состав</h2>

    ${canEdit ? `
      <div class="panel">
        <h3>Добавить / изменить военнослужащего</h3>
        <form id="personForm">
          <input type="hidden" name="id">

          <label>RP-ник</label>
          <input name="name" maxlength="100" required>

          <label>Звание</label>
          <input name="rank">

          <label>Должность</label>
          <input name="position">

          <label>Подразделение</label>
          <select name="unit">
            ${available.map(u =>
              `<option>${E(u)}</option>`).join("")}
          </select>

          <button class="btn">Сохранить</button>
          <button class="btn secondary" type="reset">
            Очистить
          </button>
        </form>
      </div>` : `
      <p class="muted">Публичный список военнослужащих</p>
    `}

    <div class="grid">
      ${personnel.map(p => `
        <div class="person-card">
          <h3>${E(p.name)}</h3>
          <p><b>Звание:</b> ${E(p.rank)}</p>
          <p><b>Должность:</b> ${E(p.position)}</p>
          <p><b>Подразделение:</b> ${E(p.unit)}</p>

          ${can(p.unit) ? `
            <div class="actions">
              <button class="btn secondary" data-edit="${E(p.id)}">
                Изменить
              </button>
              <button class="btn danger" data-delete="${E(p.id)}">
                Удалить
              </button>
            </div>` : ""}
        </div>
      `).join("") || '<div class="panel">Нет записей</div>'}
    </div>
  `;

  const f = $("#personForm");

  if (f) {
    f.onsubmit = async e => {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(f));
      const id = data.id;
      delete data.id;

      if (!can(data.unit)) {
        notice("Недостаточно прав");
        return;
      }

      try {
        if (id) {
          const old = personnel.find(p => String(p.id) === id);
          if (!old || !can(old.unit)) return;

          await request("/rest/v1/personnel?id=eq." +
            encodeURIComponent(id), {
            method: "PATCH",
            body: data
          });
        } else {
          await request("/rest/v1/personnel", {
            method: "POST",
            body: data
          });
        }

        notice("Личный состав обновлён");
        await loadData();
      } catch (err) {
        notice("Ошибка: " + err.message);
      }
    };
  }

  $("#app").onclick = async e => {
    const b = e.target.closest("[data-edit],[data-delete]");
    if (!b) return;

    const id = b.dataset.edit || b.dataset.delete;
    const p = personnel.find(x => String(x.id) === id);
    if (!p || !can(p.unit)) return;

    if (b.dataset.edit && f) {
      for (const k of ["id", "name", "rank", "position", "unit"]) {
        f.elements[k].value = p[k] ?? "";
      }
      f.scrollIntoView({ behavior: "smooth" });
    }

    if (b.dataset.delete && confirm("Удалить военнослужащего?")) {
      try {
        await request("/rest/v1/personnel?id=eq." +
          encodeURIComponent(p.id), { method: "DELETE" });
        await loadData();
      } catch (err) {
        notice(err.message);
      }
    }
  };
}

function reportText(date) {
  const items = checks.filter(x => x.date === date);

  return `**FORT ZANCUDO | ЕЖЕДНЕВНЫЙ ДОКЛАД**
**Дата:** ${date}
**Составил:** ${profile?.display_name || "—"}

` + (admin() ? U : units()).map(u => {
    const c = items.find(x => x.unit === u);
    return `**${u}**
${c ? `Явка: ${c.present}/${c.total}
Состояние: ${c.status}
Работа: ${c.work || "—"}
Замечания: ${c.issues || "—"}
Задачи: ${c.tasks || "—"}` : "Проверка не проведена"}`;
  }).join("\n\n") +
  `\n\n**Итого:** ${items.length} проверок.`;
}

function reports() {
  if (guest()) {
    page = "dashboard";
    render();
    return;
  }

  $("#app").innerHTML = `
    <h2>Доклад для Discord</h2>
    <div class="panel">
      <label>Дата</label>
      <input type="date" id="reportDate" value="${today()}">
      <label>Текст доклада</label>
      <textarea id="report" style="min-height:350px"></textarea>
      <button class="btn" id="copy">Скопировать</button>
    </div>
  `;

  const d = $("#reportDate");
  d.onchange = () => $("#report").value = reportText(d.value);
  d.onchange();

  $("#copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText($("#report").value);
      notice("Доклад скопирован");
    } catch {
      $("#report").select();
      notice("Выделите и скопируйте текст");
    }
  };
}

function accounts() {
  if (!admin()) {
    $("#app").innerHTML = "<h2>Нет доступа</h2>";
    return;
  }

  $("#app").innerHTML = `
    <h2>Управление ролями</h2>
    <p class="note">
      Учётные записи создаются через Supabase Authentication.
    </p>

    <div class="panel table">
      <table>
        <thead>
          <tr>
            <th>Пользователь</th>
            <th>Роль</th>
            <th>Подразделение</th>
            <th>Действие</th>
          </tr>
        </thead>
        <tbody>
          ${profiles.map(p => `
            <tr>
              <td>
                <input data-id="${E(p.id)}"
                  data-k="display_name"
                  value="${E(p.display_name)}">
              </td>
              <td>
                <select data-id="${E(p.id)}" data-k="role">
                  ${["viewer", "commander", "commandant", "general"]
                    .map(r => `<option value="${r}"
                      ${r === p.role ? "selected" : ""}>
                      ${r}</option>`).join("")}
                </select>
              </td>
              <td>
                <select data-id="${E(p.id)}" data-k="unit">
                  <option value="">—</option>
                  ${U.map(u => `<option value="${E(u)}"
                    ${u === p.unit ? "selected" : ""}>
                    ${E(u)}</option>`).join("")}
                </select>
              </td>
              <td>
                <button class="btn" data-save="${E(p.id)}">
                  Сохранить
                </button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  $("#app tbody").onclick = async e => {
    const b = e.target.closest("[data-save]");
    if (!b) return;

    const id = b.dataset.save;
    const vals = {};

    $("#app").querySelectorAll("[data-id]").forEach(x => {
      if (x.dataset.id === id) {
        vals[x.dataset.k] = x.value || null;
      }
    });

    if (vals.role === "commander" && !vals.unit) {
      notice("Укажите подразделение");
      return;
    }

    if (!confirm("Изменить права пользователя?")) return;

    try {
      await request("/rest/v1/profiles?id=eq." +
        encodeURIComponent(id), {
        method: "PATCH",
        body: vals
      });
      notice("Роль обновлена");
      await loadData();
    } catch (err) {
      notice("Ошибка: " + err.message);
    }
  };
}

window.addEventListener("error", e =>
  notice("Ошибка приложения: " + e.message)
);

start();
</script>
</body>
</html>
